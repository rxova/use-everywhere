name: CI

on:
  # No paths-ignore on push: Release is gated on this workflow succeeding for the
  # commit being released, so a push to main that skipped CI would never publish.
  # `.changeset/*.md` matches `**/*.md`, which means the one push most likely to
  # need a release — a merge whose only new file is a changeset — is exactly the
  # one that would have been skipped.
  push:
    branches: [main, development]
  pull_request:
    # `labeled`/`unlabeled` matter: the changeset gate's documented escape hatch
    # is the `skip-changeset` label, and without these the label lands on a PR
    # whose checks never re-run — so the hatch only worked via a manual re-run.
    # Matches rxova/brand.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - 'apps/docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset for published-package changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --import tsx ./packages/tooling/check-changeset.ts

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      # Turbo knows dependents typecheck and measure against the libraries'
      # dist, so it builds them first. This replaces the explicit
      # `pnpm --filter core --filter use-everywhere build` that every job used to
      # open with, and replays whatever this commit did not touch.
      #
      # The docs site is excluded from the *build*: rehype-mermaid renders its
      # two diagrams through headless chromium, which only the Docs workflow
      # installs, and building it here would fail on a missing browser. That
      # workflow owns the docs build — it triggers on apps/docs/** and
      # packages/*/src/**, so library changes still get their docs checked. This
      # job ignores apps/docs/** entirely (see paths-ignore).
      #
      # The filter has to cover `size` as well as `build`: `size` depends on its
      # own package's build, so filtering `build` alone lets it schedule
      # `docs#build` right back in.
      - name: Build and size budgets
        run: pnpm exec turbo run build size --filter='!@use-everywhere/docs'
      # Unfiltered on purpose: `typecheck` (astro check) depends on `^build` —
      # its dependencies, never its own package's build — so the docs site is
      # still typechecked here, it just is not built.
      - name: Typecheck
        run: pnpm exec turbo run typecheck

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # Both are in the local pre-push gate too (scripts/verify.mjs). Running
      # them here as well is what keeps a stale local checkout from being the
      # only thing between a newly-disclosed advisory and a release.
      - name: Audit dependencies
        run: pnpm run audit:check
      - name: Check dependency dedupe
        run: pnpm run dedupe:check

  e2e:
    # The assertions unit tests cannot make: a real BroadcastChannel, real tabs,
    # real localStorage. One browser context — separate contexts are separate
    # storage partitions and would not see each other's broadcasts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm run e2e:install
      # `pnpm e2e` builds the two libraries through Turbo first — the demo app
      # Playwright's webServer serves imports them — then runs the suite.
      - name: End-to-end
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 needs Node >= 22.13, so 20 can't be exercised in CI.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node-version }}
      # Deliberately no turbo-cache here. Turbo hashes files and env, not the
      # Node binary, and the cache action keys on `github.job` — which is the
      # same string for every leg of a matrix. Both legs would share one cache,
      # so node 24 could replay a result computed under node 22, which is
      # exactly what this matrix exists to prevent.
      - run: pnpm install --frozen-lockfile
      # `test` depends on `^build`, so Turbo builds the libraries first.
      - name: Test with coverage thresholds
        run: pnpm test
