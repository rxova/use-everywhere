name: Release

# Runs only after CI has gone green on main. CI already runs the full gate
# (lint, types, build, tests on two Node versions, e2e, audit) on the exact
# commit being released, so re-running the whole suite here would just duplicate
# it. Gating on CI's success gives the same guarantee — "a push to main cannot
# publish something a PR would have been blocked on" — without paying twice.
#
# Publishing goes through changesets/action, which opens a `chore: version
# packages` pull request and only publishes once that PR is merged. This
# replaced a hand-rolled `changeset version` -> self-commit -> `changeset
# publish` -> `git push` sequence, which had two problems the action does not:
# it checked out `ref: main` by name rather than the commit CI verified, so a
# merge landing between the two could publish code that never passed CI; and it
# pushed straight to main, so a bad bump was already on npm — immutably — by the
# time anyone saw it. Matches rxova/brand, rxova/react-inputs and rxova/journey.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    # workflow_run fires on failure as well, so the conclusion is checked.
    if: >-
      github.repository == 'rxova/use-everywhere' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write # version commit and tags
      pull-requests: write # the version pull request
      id-token: write # npm trusted publishing (OIDC), with provenance
    # `pnpm run release` builds the published packages through Turbo, then
    # `changeset publish`; the demo and docs are not published.
    uses: rxova/shared/.github/workflows/changesets-release.yml@main
