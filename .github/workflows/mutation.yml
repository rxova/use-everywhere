name: Mutation

# Scheduled rather than per-PR. The run is ~8 minutes — longer than every other
# job put together — and it was setting the wall-clock for every pull request
# while catching something perhaps once a month. A schedule keeps the signal and
# takes it off the critical path.
#
# The trade is real and worth stating: a regression can now land on main and go
# unnoticed until the next run. That is acceptable because the thing being
# measured is test *quality*, which drifts slowly, and because per-file coverage
# thresholds still gate every PR — mutation testing catches the tests that pass
# without asserting, not the ones that are missing.
#
# Run it yourself before merging anything that reworks a core module:
#   pnpm run mutation
on:
  schedule:
    # Sunday, Wednesday and Friday at 03:17 UTC — roughly every other day, but
    # on fixed weekdays. `*/2` on day-of-month would drift at every month
    # boundary (the 31st is followed by the 1st, a one-day gap).
    #
    # Deliberately not on the hour: GitHub queues scheduled jobs across every
    # repository, and the top of the hour is where they pile up.
    - cron: '17 3 * * 0,3,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Stryker reruns the core suite, which includes the happy-dom files. See the
# matching block in ci.yml for why Node 26 needs this: happy-dom does not
# install its Storage over the placeholder `localStorage` that Node 26 now
# defines, so those specs fail without it.
env:
  NODE_OPTIONS: --no-experimental-webstorage

jobs:
  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # Stryker's own threshold gates the overall score; check-mutation.ts then
      # fails any single module below the floor, which an overall number can
      # hide. Both run from this one script.
      - name: Mutation testing
        run: pnpm run mutation
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: packages/core/reports/mutation
          retention-days: 14
