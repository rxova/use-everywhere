<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>use-everywhere — every feature, live in your tabs</title>
    <meta
      name="description"
      content="State, messages, presence and leadership shared across tabs, windows and workers. Open any page in two tabs and watch."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>◎</text></svg>"
    />
    <script>
      // The theme is shared state like everything else here, so React owns it —
      // but it is persisted, and reading it back after mount would mean a frame
      // of the wrong palette. Same storage key and envelope as the store writes.
      try {
        const saved = JSON.parse(localStorage.getItem('use-everywhere:showcase-theme'))?.state
          ?.theme;
        if (saved === 'light' || saved === 'dark')
          document.documentElement.setAttribute('data-theme', saved);
      } catch {
        // No stored choice, or storage is blocked: fall back to the OS preference.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
