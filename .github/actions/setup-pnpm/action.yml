name: Setup pnpm
description: Install pnpm (version from the packageManager field) and Node.js with pnpm caching.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Report versions
      shell: bash
      run: |
        node --version
        pnpm --version
