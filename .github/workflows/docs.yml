name: Docs

# Docs are published as part of rxova.org (the rxova/rxova-website aggregator),
# not from this repo. The aggregator does not build them: this workflow builds
# the dist for /packages/use-everywhere/, uploads it as the `docs-dist`
# artifact, and dispatches a `docs` event naming this run — gate 1 of the
# contract in rxova/rxova-website docs/INPUTS-CONTRACT.md. rxova.org validates
# what arrives, persists it, and republishes; a rejection leaves the live site
# untouched.
#
# Requires secret AGGREGATOR_DISPATCH_TOKEN (fine-grained PAT with Contents:
# write on rxova/rxova-website).

on:
  push:
    branches: [main]
  # Docs breakage should fail the PR that causes it, not the aggregator deploy
  # that ships it — a red rxova.org build blocks every project on the site.
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # Build the libraries first: TypeDoc resolves use-everywhere -> core through dist types.
      - run: pnpm run libs:build

      # The two mermaid diagrams are rendered to static SVG at build time by
      # rehype-mermaid, which drives headless chromium. Without this the build
      # fails rather than silently degrading.
      - run: pnpm --filter @use-everywhere/docs exec playwright install --with-deps chromium

      # Build at the path the aggregator actually serves these docs from.
      # Absolute references that only work at the domain root are invisible in a
      # root build and break silently once mounted. starlight-links-validator
      # runs as part of the build and fails on any broken internal link.
      - name: Build docs at the aggregator base path
        env:
          DOCS_URL: https://rxova.org
          DOCS_BASE_URL: /packages/use-everywhere/
        run: pnpm --filter @use-everywhere/docs build

      - name: Mark the page-component bundle
        run: node apps/docs/scripts/write-page-bundle.mjs

      # The dist the aggregator will compose into its shell. `docs-dist` is the fixed
      # artifact name in the contract — ingest.yml downloads it by that name
      # from this run — so it is not ours to rename. Pointing `path` at the dist
      # directory (not its parent) is what puts index.html at the artifact root,
      # which is gate 2b's check.
      #
      # Uploaded on pull requests too: the artifact is then the reviewable
      # output of the check, and an empty dist fails here rather than at ingest.
      - name: Upload docs-dist
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          if-no-files-found: error

  # Gate 1 of the docs pipeline: tell rxova.org that this run holds a dist built
  # for /packages/use-everywhere/. The aggregator validates the payload,
  # downloads the artifact above, and persists + publishes it — it never builds
  # these docs itself. Contract: rxova/rxova-website docs/INPUTS-CONTRACT.md.
  notify-website:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs ingest to rxova.org
        # No continue-on-error, unlike the pre-contract dispatch this replaces.
        # Back then the aggregator rebuilt the docs from source on its own
        # schedule, so a dropped notification only delayed a publish. Now the
        # dispatch *is* the publish: swallowing a failure would leave the site
        # serving stale docs with a green tick here and nothing to look at.
        env:
          GH_TOKEN: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
        # `-F` only for schema, which the receiver compares as the number 2;
        # everything else goes through `-f` so it stays a string, and an
        # all-digit ref or sha cannot arrive as a number.
        run: |
          gh api repos/rxova/rxova-website/dispatches \
            -f event_type=docs \
            -F 'client_payload[schema]=2' \
            -f 'client_payload[project]=use-everywhere' \
            -f "client_payload[ref]=${GITHUB_REF_NAME}" \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}" \
            -f 'client_payload[base]=/packages/use-everywhere/' \
            -f 'client_payload[framework]=astro'
