name: CI

# Every job but e2e is a reusable workflow from rxova/shared, called at @main.
# What stays here is the graph: which jobs run, and when. The steps are the ones
# `pnpm run verify` runs, and the pre-push hook runs that end to end, so a green
# push is a green pipeline.
#
# Release is gated on this workflow succeeding for the commit being released,
# so a push to main that skipped CI would never publish.

on:
  push:
    branches: [main]
  pull_request:
    # No `edited`: the title check lives in pr-title.yml. `labeled`/`unlabeled`
    # re-run the changeset gate, whose escape hatch is the `skip-changeset` label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Superseded pull request runs are cancelled; main runs always finish, because
# Release reads this workflow's conclusion to decide whether to publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  commitlint:
    name: commit messages
    uses: rxova/shared/.github/workflows/commit-messages.yml@main

  # The docs site is left out of the build: docs.yml builds it at the base path
  # rxova.org mounts it on, and it needs a browser for the mermaid diagrams.
  checks:
    name: lint · format · types · build
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/repo-checks.yml@main
    with:
      build-command: pnpm exec turbo run build size --filter='!@use-everywhere/docs'
      extra-command: pnpm run check:llms

  test:
    name: unit
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/unit-tests.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  supply-chain:
    name: audit · sherif · knip · dedupe
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/supply-chain.yml@main

  package:
    name: package contract
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/package-contract.yml@main

  # The peer range is `react >=18`, and every other test runs against the 19 in
  # the lockfile. React 18's `useSyncExternalStore` is a different
  # implementation, and it is the hook every hook here is built on.
  react18:
    name: unit (react 18)
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/react-minimum-version.yml@main
    with:
      react-version: 18.3.1
      filters: use-everywhere
      # The hooks' suite resolves @use-everywhere/core through its exports map,
      # which points at a dist a fresh checkout does not have.
      build-command: pnpm run libs:build
      test-command: pnpm --filter use-everywhere test

  # The assertions unit tests cannot make: a real BroadcastChannel, real tabs,
  # real localStorage. One job per engine: everything this library rests on —
  # BroadcastChannel, pagehide/pageshow, storage partitioning, popups — is
  # exactly where the engines differ, so a WebKit failure should be readable on
  # its own, and one red engine must not hide the verdict on the other two.
  e2e:
    name: e2e (${{ matrix.browser }})
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
        with:
          key: e2e-${{ matrix.browser }}
      - run: pnpm install --frozen-lockfile
      # Only the engine this leg needs.
      - uses: rxova/shared/actions/setup-playwright@main
        with:
          browsers: ${{ matrix.browser }}
      # `libs:build` first through Turbo — the demo app Playwright's webServer
      # serves imports the runtime libraries — then the suite for this engine.
      - name: End-to-end
        run: pnpm run libs:build && pnpm exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  docs-checks:
    name: docs checks
    needs: [commitlint]
    if: needs.commitlint.outputs.docs-only == 'true'
    uses: rxova/shared/.github/workflows/docs-checks.yml@main
    with:
      command: pnpm run format:check

  # Each changeset must name exactly one package
  # (`repoConfig.changeset.singlePackage` in the root package.json).
  changeset:
    name: changeset present
    needs: [commitlint]
    uses: rxova/shared/.github/workflows/changeset-gate.yml@main

  # The one context branch protection requires. `skipped` passes; `failure`
  # and `cancelled` do not.
  all-checks:
    name: all checks
    if: always()
    needs: [commitlint, checks, test, supply-chain, package, react18, e2e, docs-checks, changeset]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rxova/shared/actions/require-jobs@main
        with:
          needs: ${{ toJSON(needs) }}
