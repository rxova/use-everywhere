name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` matter: the changeset gate's documented escape hatch
    # is the `skip-changeset` label, and without these the label lands on a PR
    # whose checks never re-run — so the hatch only worked via a manual re-run.
    #
    # `edited`: retitling a PR must re-check it, because the title becomes the
    # squash-merge commit message and nothing else validates it.
    #
    # All three are metadata-only, and since none of them moves HEAD they now
    # run the two gates that read metadata and skip everything that reads the
    # tree — see the concurrency group and `commitlint`'s `code-changed` output.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    # No paths-ignore, on either trigger. It used to skip apps/docs/** and
    # **/*.md on pull requests, which had two consequences once commitlint
    # became the root of this graph: a docs-only PR ran no workflow at all, so
    # its title — the squash-merge subject — went unchecked; and `.changeset/*.md`
    # matches `**/*.md`, so the one PR most likely to need a release was the one
    # whose checks never ran. Turbo's cache is what makes dropping the filter
    # cheap: on a prose-only change every task replays.
    #
    # Release is also gated on this workflow succeeding for the commit being
    # released, so a push to main that skipped CI would never publish.

permissions:
  contents: read

# Two lanes per ref, not one. `edited`, `labeled` and `unlabeled` move no file,
# so they only need the PR-metadata gates below — but while this was a single
# group they also *cancelled* whatever full run was in flight for the same
# commit, and the replacement run started the whole graph again from zero. Over
# a representative week that was 9 of 32 runs on a SHA that had already been
# built, roughly a fifth of everything this repository spends on Actions.
#
# Splitting the group is the half that stops the cancelling; the `code-changed`
# output below is the half that stops the re-running.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    contains(fromJSON('["edited", "labeled", "unlabeled"]'), github.event.action)
    && 'metadata' || 'code' }}
  cancel-in-progress: true

jobs:
  # The root of the graph: everything else declares `needs: [commitlint]`.
  # Commit messages were previously validated only by the local commit-msg hook,
  # which `--no-verify` skips and which never sees the PR title at all.
  #
  # It runs on push as well as pull_request on purpose. A job that is skipped
  # also skips its dependents, so gating this on `pull_request` alone would
  # silently skip the entire workflow on main — and the alternative, an
  # `if: always() && !failure()` on every other job, is the kind of expression
  # that is wrong in a way nobody notices until something ships unchecked.
  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For reading the PR title back off the API — see "Lint the PR title".
      pull-requests: read
    outputs:
      # Every job below that reads the tree is gated on this. The three PR
      # actions that set it to `false` — a title or body edit, and the two label
      # events behind the changeset escape hatch — leave HEAD exactly where it
      # was, so re-running lint, types, unit tests and three browser engines
      # recomputes a verdict this commit already carries.
      #
      # Skipping is safe for branch protection in a way that filtering the
      # trigger would not be: the earlier run's checks stay attached to the SHA,
      # and GitHub counts a job skipped by `if:` as satisfying a required check.
      # A `paths`/`types` filter on the workflow itself reports nothing at all,
      # which is the failure mode the `on:` block above is written to avoid.
      code-changed: ${{ steps.scope.outputs.code-changed }}
    steps:
      # Before the checkout: this is a property of the event, not of the tree,
      # and the whole graph waits on this job to produce it.
      - name: Decide whether this event touched the tree
        id: scope
        env:
          ACTION: ${{ github.event.action }}
        run: |
          case "$ACTION" in
            edited | labeled | unlabeled) echo 'code-changed=false' >> "$GITHUB_OUTPUT" ;;
            *) echo 'code-changed=true' >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint the branch commits
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # The squash-merge subject is the PR *title*, which no commit in the
      # branch contains and which `edited` lets someone change after CI already
      # went green.
      #
      # Read live from the API rather than out of `github.event`, because an
      # edit no longer cancels the full run in flight for this SHA — see the
      # concurrency group. Two runs can therefore be in the graph at once, both
      # publishing a check named `commit messages`, and the one that finishes
      # last is the one branch protection reads. From the payload, that could be
      # the older run affirming a title the edit has since broken; from the API,
      # either run lints the title as it stands and they agree.
      #
      # Piped, never interpolated into the shell — a title is attacker-controlled
      # text — and `set -o pipefail` so a failed lookup fails the step instead of
      # feeding commitlint an empty subject it would reject for the wrong reason.
      - name: Lint the PR title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title \
            | pnpm exec commitlint --verbose

      # On main this is the squashed subject already linted above, plus the
      # changesets `chore: version packages` commit. Cheap, and it is what keeps
      # this job unskippable.
      - name: Lint the pushed commit
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

  checks:
    name: lint · format · types · build
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      # Turbo knows dependents typecheck and measure against the libraries'
      # dist, so it builds them first. This replaces the explicit
      # `pnpm --filter core --filter use-everywhere build` that every job used to
      # open with, and replays whatever this commit did not touch.
      #
      # The docs site is excluded from the *build*: rehype-mermaid renders its
      # two diagrams through headless chromium, which only the Docs workflow
      # installs, and building it here would fail on a missing browser. That
      # workflow owns the docs build — it triggers on apps/docs/** and
      # packages/*/src/**, so library changes still get their docs checked.
      #
      # The filter has to cover `size` as well as `build`: `size` depends on its
      # own package's build, so filtering `build` alone lets it schedule
      # `docs#build` right back in.
      - name: Build and size budgets
        run: pnpm exec turbo run build size --filter='!@use-everywhere/docs'
      # Unfiltered on purpose: `typecheck` (astro check) depends on `^build` —
      # its dependencies, never its own package's build — so the docs site is
      # still typechecked here, it just is not built.
      - name: Typecheck
        run: pnpm exec turbo run typecheck

  supply-chain:
    name: audit · dedupe
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # Both are in the local pre-push gate too (packages/tooling/verify.ts). Running
      # them here as well is what keeps a stale local checkout from being the
      # only thing between a newly-disclosed advisory and a release.
      #
      # `audit:check` is deliberately not a Turbo task: its verdict depends on
      # the upstream advisory database, which changes without any file here
      # changing, so a cached pass could replay over a fresh CVE.
      - name: Audit dependencies
        run: pnpm run audit:check
      - name: Check dependency dedupe
        run: pnpm run dedupe:check

  pack-smoke:
    name: package contract
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # Neither of these existed before: the repo published two packages with no
      # packaging contract at all, so a `files` entry that dropped dist or an
      # exports map that resolved only for bundlers would have reached npm.
      #
      # Both root scripts filter to the published packages. Turbo schedules
      # a no-op task for every package that does not define the script, and each
      # of those still pulls in its own `build` — which would drag `docs#build`
      # and its chromium requirement into this job.
      - name: Publint and Are The Types Wrong
        run: pnpm run check:exports
      # Before the tarball, so a malformed or drifted llms.txt is reported as
      # itself rather than as a missing file inside pack-smoke's output. Reads
      # files only, so it needs no build.
      - name: Check packaged llms.txt files
        run: pnpm run check:llms
      - name: Pack smoke test
        run: pnpm run pack:smoke

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true' && github.head_ref != 'changeset-release/main'
    # The assertions unit tests cannot make: a real BroadcastChannel, real tabs,
    # real localStorage. One browser context — separate contexts are separate
    # storage partitions and would not see each other's broadcasts.
    #
    # One job per engine rather than one job running three projects: everything
    # this library rests on — BroadcastChannel, pagehide/pageshow, storage
    # partitioning, popups — is exactly where the engines differ, so a WebKit
    # failure should be readable without scrolling past two passing engines.
    # `fail-fast: false` for the same reason: one red engine must not hide the
    # verdict on the other two.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # Only the engine this leg needs: installing all three per job would
      # download two browsers it never launches.
      #
      # The download is the cacheable half. The other half — `--with-deps`, an
      # apt-get of the engine's shared libraries — is not: the runner is new
      # every time, and apt state does not survive in a way worth restoring.
      # So the cache holds the browser build, and a hit downgrades the step to
      # `install-deps`, which is what the browser still needs from the system.
      #
      # Keyed on the lockfile because that is what pins the Playwright version,
      # and the browser build is chosen by that version.
      - name: Restore the ${{ matrix.browser }} build
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Install the ${{ matrix.browser }} system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      # `libs:build` first through Turbo — the demo app Playwright's webServer
      # serves imports the runtime libraries — then the suite for this engine.
      - name: End-to-end
        run: pnpm run libs:build && pnpm exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  test:
    name: unit (node ${{ matrix.node-version }})
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 needs Node >= 22.13, so 20 can't be exercised in CI.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node-version }}
      # Turbo hashes files and env, not the Node binary, and the cache action
      # keys on `github.job` by default — which is one string for every leg of a
      # matrix. Sharing that would let node 24 replay a result computed under
      # node 22, which is exactly what this matrix exists to prevent, and is why
      # this job carried no Turbo cache at all until the action grew a `key`.
      #
      # Naming the partition after the leg makes the cache correct rather than
      # absent: each Node version accumulates its own results, and `test`'s
      # `^build` — four library builds this job otherwise recomputes from
      # scratch on every run — replays within the leg that produced it.
      - uses: ./.github/actions/turbo-cache
        with:
          key: unit-node${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      # `test` depends on `^build`, so Turbo builds the libraries first.
      - name: Test with coverage thresholds
        run: pnpm test

      # One leg uploads, not both: two reports for the same commit differing
      # only by Node version would make Codecov's patch gate a coin flip on
      # whichever arrived last. 24 is the version the release runs on.
      #
      # `continue-on-error` because coverage reporting must never be the reason
      # a correct branch cannot merge — the thresholds that actually gate are
      # vitest's, and they ran above.
      - name: Upload coverage
        if: matrix.node-version == 24
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Every package writes its own lcov; naming them keeps a drop
          # attributable to one package instead of to "the repo".
          files: >-
            packages/core/coverage/lcov.info,
            packages/react/coverage/lcov.info,
            packages/eslint-plugin/coverage/lcov.info,
            packages/test-utils/coverage/lcov.info
          fail_ci_if_error: false

  # The peer range is `react >=18`, and until this job existed nothing checked
  # the lower bound — every test ran against the 19 in the lockfile. React 18's
  # `useSyncExternalStore` is a different implementation, and it is the hook
  # every hook here is built on, so "supports 18" was a claim, not a fact.
  #
  # Tests only, deliberately: typechecking against 18 would need @types/react@18
  # too, and the types are already exercised by the `check` job against the
  # version people install today. What this leg proves is runtime behaviour.
  react18:
    name: unit (react 18)
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      # Not `--frozen-lockfile` compatible by definition: this is the one job
      # that wants a dependency the lockfile does not pin. The checkout is
      # throwaway, so the mutated lockfile never leaves the runner.
      - name: Downgrade React to 18
        run: pnpm --filter use-everywhere add -D react@^18.3.1 react-dom@^18.3.1
      # `libs:build` first, the way every other job that runs tests does it
      # through Turbo's `^build`: this job calls vitest directly, and vitest
      # resolves `@use-everywhere/core` through its exports map — which points
      # at a dist that does not exist on a fresh checkout.
      - name: Test the hooks against React 18
        run: pnpm run libs:build && pnpm --filter use-everywhere test

  changeset:
    name: changeset present
    needs: [commitlint]
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    permissions:
      contents: read
      # check-changeset.ts reads the skip-changeset label through the API
      # (`gh api repos/.../labels`). Without this the call 403s, the script
      # warns and proceeds label-blind, and the documented escape hatch
      # silently does nothing.
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset for published-package changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --import tsx ./packages/tooling/check-changeset.ts
