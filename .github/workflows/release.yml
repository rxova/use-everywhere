name: Release

# Merging development into main versions and publishes the packages, so main
# always points at the latest published release. Bumps come from pending
# changesets (pnpm changeset): patch / minor / major per package.
on:
  push:
    branches: [main]

permissions:
  contents: write
  # Required for npm provenance attestations.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rxova/use-everywhere'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply pending changesets
        id: version
        run: |
          pnpm changeset version
          pnpm install --lockfile-only
          if git diff --quiet; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): version packages [skip ci]"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build libraries
        if: steps.version.outputs.released == 'true'
        run: pnpm --filter @use-everywhere/core --filter use-everywhere build

      - name: Publish to npm with provenance
        if: steps.version.outputs.released == 'true'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          pnpm config set '//registry.npmjs.org/:_authToken' "${{ secrets.NPM_TOKEN }}"
          pnpm changeset publish

      - name: Push release commit and tags
        if: steps.version.outputs.released == 'true'
        run: git push --follow-tags origin main

      - name: Create GitHub releases
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            gh release create "$tag" --title "$tag" --generate-notes || true
          done
