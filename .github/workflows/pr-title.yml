name: PR title

# The PR title is linted like a commit subject: no commit in the branch contains
# it, and `edited` lets someone change it after CI has already gone green. So it
# has to be checked, and it has to be re-checked on every edit.
#
# It lives here rather than in CI's `types:` because `edited` also fires on
# *body* edits, and there is no trigger-level way to tell the two apart. In CI a
# body edit re-ran the graph, skipped every job that reads the tree and still
# reported `all checks` — a verdict that had tested nothing. Here the same edit
# costs one job doing one thing, under a name nothing requires.
#
# Its own concurrency group, so retitling can never cancel a CI run.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  # For reading the PR title back off the API — see "Lint the PR title".
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: commit message (PR title)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      # Read live from the API rather than out of `github.event`. Cancellation
      # is not instant, so two runs can overlap, and the one reading the payload
      # could affirm a title a newer edit has since broken. From the API, either
      # run lints the title as it stands and they agree.
      #
      # Piped, never interpolated into the shell — a title is attacker-controlled
      # text — and `set -o pipefail` so a failed lookup fails the step instead of
      # feeding commitlint an empty subject it would reject for the wrong reason.
      - name: Lint the PR title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title \
            | pnpm exec commitlint --verbose
