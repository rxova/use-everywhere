name: Docs

# Docs are published as part of rxova.org (the rxova/rxova-website aggregator),
# not from this repo. On push to main we build the docs to catch breakage, then
# notify the aggregator to rebuild rxova.org/packages/use-everywhere.
# Requires secret AGGREGATOR_DISPATCH_TOKEN (fine-grained PAT with Contents:
# write on rxova/rxova-website).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      # Build the libraries first: TypeDoc resolves use-everywhere -> core through dist types.
      - run: pnpm --filter @use-everywhere/core --filter use-everywhere build
      - run: pnpm --filter @use-everywhere/docs build

  notify-website:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rxova.org rebuild
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
          repository: rxova/rxova-website
          event-type: docs-use-everywhere
          client-payload: '{"ref": "${{ github.sha }}"}'
