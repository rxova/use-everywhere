name: 'Feature request'
description: 'Suggest an idea for use-everywhere.'
title: 'feat: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: 'Describe the use case, not just the proposed API.'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: 'What would you like to see? Sketch the API if you can.'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
