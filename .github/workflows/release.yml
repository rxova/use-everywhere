name: Release

# Merging a PR into main versions and publishes the packages, so main always
# points at the latest published release. Bumps come from pending changesets
# (pnpm changeset): patch / minor / major per package.
#
# Gated on CI having gone green for the commit being released, rather than firing
# on the push itself: CI runs the full gate (lint, types, build, tests on two
# Node versions, e2e, audit) on that exact commit, so publishing on the raw push
# meant a red build could still reach npm — and npm publishes are immutable.
# Waiting on CI's result gives the guarantee without running the suite twice.
# Mirrors rxova/brand and rxova/react-inputs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Required for npm provenance attestations.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_run fires on both success and failure, so the conclusion has to be
    # checked explicitly. A manual dispatch has no upstream run to gate on.
    if: >-
      github.repository == 'rxova/use-everywhere' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # By name, not the workflow_run's SHA: this job commits the version
          # bump and pushes it, so it needs an attached branch rather than a
          # detached HEAD. fetch-depth 0 for changesets' history walk.
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply pending changesets
        id: version
        run: |
          pnpm changeset version
          pnpm install --lockfile-only
          if git diff --quiet; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # add -A, not commit -a: changesets deletes the consumed changesets
            # and writes brand-new CHANGELOG.md files, and -a skips untracked
            # files — so -a would publish without ever committing a changelog.
            git add -A
            # --no-verify: the husky pre-commit hook typechecks the workspace,
            # but the libraries are built in the next step, so core has no .d.ts
            # yet and every react import fails to resolve. CI already gated this
            # code on the PR; re-running the suite on a generated bump is moot.
            git commit --no-verify -m "chore(release): version packages [skip ci]"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # Through Turbo for one build definition repo-wide, but deliberately
      # without the turbo-cache action: a release builds from scratch on a clean
      # runner, so what is published is what this commit produces rather than a
      # replay of an artifact cached against an earlier tree.
      - name: Build libraries
        if: steps.version.outputs.released == 'true'
        run: pnpm run libs:build

      - name: Publish to npm with provenance
        if: steps.version.outputs.released == 'true'
        run: |
          # Auth via npm trusted publishing (OIDC): npm >= 11.5.1 exchanges the
          # Actions id-token for credentials — no token secret involved.
          # Provenance is generated automatically on trusted publishes.
          npm install -g npm@latest
          pnpm changeset publish

      - name: Push release commit and tags
        if: steps.version.outputs.released == 'true'
        run: git push --follow-tags origin main

      - name: Create GitHub releases
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            gh release create "$tag" --title "$tag" --generate-notes || true
          done
