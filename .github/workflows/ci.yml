name: CI

on:
  push:
    branches: [main, development]
    paths-ignore:
      - 'apps/docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'apps/docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset for published-package changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --import tsx ./packages/tooling/check-changeset.ts

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      # Libraries must be built first: dependents typecheck against dist types.
      - run: pnpm --filter @use-everywhere/core --filter use-everywhere build
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Size budgets
        run: pnpm size

  e2e:
    # The assertions unit tests cannot make: a real BroadcastChannel, real tabs,
    # real localStorage. One browser context — separate contexts are separate
    # storage partitions and would not see each other's broadcasts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @use-everywhere/core --filter use-everywhere build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 needs Node >= 22.13, so 20 can't be exercised in CI.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @use-everywhere/core --filter use-everywhere build
      - name: Test with coverage thresholds
        run: pnpm test
