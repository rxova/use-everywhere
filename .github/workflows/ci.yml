name: CI

on:
  push:
    branches: [main, development]
    paths-ignore:
      - 'apps/docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'apps/docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      # Libraries must be built first: dependents typecheck against dist types.
      - run: pnpm --filter @use-everywhere/core --filter use-everywhere build
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 needs Node >= 22.13, so 20 can't be exercised in CI.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @use-everywhere/core --filter use-everywhere build
      - name: Test with coverage thresholds
        run: pnpm test
