name: 'Bug report'
description: 'Report a reproducible problem in use-everywhere.'
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: Package version(s)
      description: 'Which package and version are you using?'
      placeholder: 'use-everywhere@x.y.z, @use-everywhere/core@x.y.z'
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface is affected?
      options:
        - Shared state (useSharedState / createSharedStore)
        - Messages (useMessage / createChannel)
        - Presence (usePeers / createPresence)
        - Leader election (useLeader / createLeader)
        - Persistence (defineStore / persist adapters)
        - Cross-origin window channel (openWindow / connectToOpener)
        - Devtools (Inspector)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: 'A clear and concise description of the bug.'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: 'Minimal steps or a repo/sandbox link. For cross-tab bugs, mention how many tabs/windows/workers are involved and their origins.'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / environment
      placeholder: 'Chrome 130, Firefox 132, Node 22 (SSR), …'
