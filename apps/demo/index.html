<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>use-everywhere — demo</title>
    <script>
      // The theme is shared state like everything else here, so React owns it —
      // but it is persisted, and reading it back after mount would mean a frame
      // of the wrong palette. Same storage key and envelope as the store writes.
      try {
        const saved = JSON.parse(localStorage.getItem('use-everywhere:demo-theme'))?.state?.theme;
        if (saved === 'light' || saved === 'dark')
          document.documentElement.setAttribute('data-theme', saved);
      } catch {
        // No stored choice, or storage is blocked: fall back to the OS preference.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
