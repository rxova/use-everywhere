name: CodeQL

# Security analysis of the libraries' source, weekly as well as per change,
# because the query pack changes without this tree changing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the query pack changes without this tree changing.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    uses: rxova/shared/.github/workflows/codeql-analysis.yml@main
